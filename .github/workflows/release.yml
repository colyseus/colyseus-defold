name: Build, Release & Publish

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Checkout & Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

      #
      # ADD TEST/BUILD STEPS HERE
      #

  release:
    name: Check version & Create release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      released: ${{ steps.check.outputs.version }} # expose release.outputs.released for the "publish" job
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - uses: EndBug/version-check@v2
      id: check
      with:
        file-name: release.json
        diff-search: true
    - name: Create Release
      if: steps.check.outputs.changed
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.check.outputs.version }}
        release_name: ${{ steps.check.outputs.version }}
        draft: false
        prerelease: false