name: Release

# On every push to master:
# - release: tag + GitHub release for release.json's version, unless one exists
#   already (notes = that version's CHANGELOG.md section)
# - family branch: fast-forward MAJOR.MINOR (e.g. 0.18) to master, so
#   `archive/<family>.zip` dependencies get the family's latest
on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read release.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      family: ${{ steps.read.outputs.family }}
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: read
        run: |
          version=$(jq -r .version release.json)
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error file=release.json::version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "family=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to do."
            exit 0
          fi
          awk -v v="$VERSION" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::no '## $VERSION' section to use as release notes"
            exit 1
          fi
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  sync-family-branch:
    name: Update the ${{ needs.version.outputs.family }} branch
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward the family branch
        env:
          FAMILY: ${{ needs.version.outputs.family }}
        run: |
          # fast-forward only: commits on the family branch that master lacks
          # are a merge still owed, never something to overwrite
          if git rev-parse -q --verify "refs/remotes/origin/$FAMILY" > /dev/null &&
             ! git merge-base --is-ancestor "origin/$FAMILY" "$GITHUB_SHA"; then
            echo "::error::$FAMILY has commits master doesn't. Merge $FAMILY into master; it is never force-pushed."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/$FAMILY"
